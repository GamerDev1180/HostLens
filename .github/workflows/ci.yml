# Typechecks and tests the agent and the app on our own (self-hosted) runners,
# so platform-specific code (PowerShell vs /proc collectors) runs on real
# machines and logs stay on hand (runner's _diag folder + the Actions tab).
#
# Platforms: Windows always. Add Linux once a Linux runner is registered by
# setting the repository variable CI_PLATFORMS to ["windows","linux"]
# (Settings → Secrets and variables → Actions → Variables).
#
# The repo is public: jobs never run for pull requests from forks, because
# that would execute a stranger's code on our machines.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.22.0
  NODE_VERSION: 24

jobs:
  agent:
    name: Agent (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.CI_PLATFORMS || '["windows"]') }}
    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","Linux"]') || fromJSON('["self-hosted","Windows"]') }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # agent/pnpm-lock.yaml isn't committed yet; once it is, switch to --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      # Runs against the runner's real OS: metrics, processes, connections and
      # local diagnostics (ping 127.0.0.1) on each platform.
      - run: pnpm test

  app:
    name: App (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.CI_PLATFORMS || '["windows"]') }}
    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","Linux"]') || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Self-hosted Linux: only installs what's missing (needs passwordless sudo
      # the first time, or install these by hand once).
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pkgs="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential"
          missing=$(for p in $pkgs; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        working-directory: HostLens-program
        run: pnpm install --frozen-lockfile

      # `tsc && vite build`: typechecks the frontend (including the agent's API
      # types it imports) and produces dist/, which the Rust build embeds.
      - name: Build frontend
        working-directory: HostLens-program
        run: pnpm build

      # Offline tests only; the network tests (--ignored) need a live FiveM server.
      - name: Rust tests
        working-directory: HostLens-program/src-tauri
        env:
          # Outside the workspace, which checkout wipes each run, so incremental
          # Rust builds survive between runs on the same machine. (The runner
          # context only exists at step level, not in job-level env.)
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/hostlens-target
        run: cargo test --locked
